<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Automation Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>LinkedIn Auto-Applier</h1>
            <p>Configure your bot to apply to jobs automatically.</p>
        </header>

        <form id="botForm" enctype="multipart/form-data">
            <div class="input-group">
                <label for="keyword">Job Role</label>
                <input type="text" id="keyword" name="keyword" placeholder="e.g. Python Developer" required>
            </div>

            <div class="input-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="e.g. Chennai" required>
            </div>

            <div class="input-group">
                <label for="experience">Years of Experience</label>
                <input type="number" id="experience" name="experience" placeholder="e.g. 0" required>
            </div>

            <div class="input-group">
                <label for="extra_details">Extra Details (Optional)</label>
                <textarea id="extra_details" name="extra_details" placeholder="Any specific requirements or answers for forms?"></textarea>
            </div>

            <div class="input-group file-upload">
                <label for="resume">Upload Resume (PDF)</label>
                <input type="file" id="resume" name="resume" accept="application/pdf" required>
                <small>The bot will extract your skills to answer job questions!</small>
            </div>

            <div class="button-group">
                <button type="submit" id="startBtn">Start Automation</button>
            </div>
        </form>

        <div id="statusBox" class="hidden">
            <div class="loader"></div>
            <p id="statusMessage">Starting...</p>
            <div class="live-counter">Applications Submitted: <span id="liveAppCount">0</span></div>
            <button id="stopBtn" class="stop-btn">🛑 Stop Automation</button>
        </div>

        <div id="resultsBox" class="hidden">
            <div class="results-header">
                <h2>🎉 Execution Summary</h2>
                <span id="resultsBadge" class="badge">0 Applied</span>
            </div>
            <p id="resultsSummary">Automation completed.</p>
            <h3>Applied Companies / Positions:</h3>
            <ul id="appliedList" class="company-list">
                <!-- Dynamically populated -->
            </ul>
            <button id="newRunBtn" class="secondary-btn">Start New Search</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
